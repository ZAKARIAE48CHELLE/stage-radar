name: Daily internship scrape

on:
  schedule:
    - cron: "17 6 * * *"     # every day 06:17 UTC (≈ 07:17 Morocco)
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Scrape, score, export
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          MAIL_TO: ${{ vars.MAIL_TO }}

        run: python -m scraper.run --notify

      - name: Commit updated data
        run: |
          git config user.name  "stage-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers.db app/public/data/offers.json app/public/data/offers.csv
          git diff --cached --quiet || git commit -m "data: daily scrape $(date -u +%F)"
          git push
