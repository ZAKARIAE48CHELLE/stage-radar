<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stage Radar</title>
<meta name="description" content="Les stages du Maroc, triés selon votre profil, avec suivi de candidatures.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stage Radar">
<script>
  if ('serviceWorker' in navigator) window.addEventListener('load',
    () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
if (window.tailwind) tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
  colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',500:'#2563eb',600:'#1d4ed8',700:'#1e40af',900:'#0f172a' } } } } };
</script>
<script src="/config.js"></script>
<style>
  body { background:#fafaf9; }
  .scroll::-webkit-scrollbar{width:6px;height:6px}.scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .desc{white-space:pre-line}
  .chart-box{position:relative;width:100%;height:280px}
  .nav-btn[aria-current="page"]{background:#eff6ff;color:#1d4ed8}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px #93c5fd}
</style>
</head>
<body class="text-slate-800 antialiased font-sans min-h-screen flex flex-col">

<header id="topbar" class="hidden sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <a href="/offres" class="flex items-center gap-2.5 shrink-0">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-700 to-indigo-600 text-white flex items-center justify-center font-extrabold text-sm">SR</span>
      <span class="font-extrabold text-slate-900 hidden sm:inline" id="appName">Stage Radar</span>
    </a>
    <nav id="nav" class="flex items-center gap-1 text-sm font-semibold text-slate-600 overflow-x-auto scroll"></nav>
    <div class="flex items-center gap-2 shrink-0">
      <a href="/perso.html" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 hidden md:inline" title="Voir le dashboard personnel d'origine">Vue Perso</a>
      
      <!-- Menu Profil utilisateur & Déconnexion -->
      <div class="relative" id="userMenuWrap">
        <button id="userMenuBtn" type="button" aria-expanded="false" aria-haspopup="true" class="flex items-center gap-2 p-1 sm:px-2.5 sm:py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 transition shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
          <span id="userAvatar" class="w-7 h-7 rounded-lg bg-gradient-to-tr from-blue-700 to-indigo-600 text-white font-extrabold text-xs flex items-center justify-center shadow-inner">U</span>
          <span id="whoami" class="text-xs font-bold text-slate-800 max-w-[140px] truncate hidden sm:inline"></span>
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
        </button>

        <div id="userDropdown" class="hidden absolute right-0 mt-2 w-60 rounded-2xl bg-white border border-slate-200 shadow-2xl py-2 z-50 text-xs">
          <div class="px-4 py-2.5 border-b border-slate-100">
            <p id="userDropdownName" class="font-bold text-slate-900 truncate text-sm"></p>
            <p id="userDropdownEmail" class="text-[11px] text-slate-500 truncate mt-0.5"></p>
            <div id="userDropdownBadge" class="mt-1.5"></div>
          </div>
          
          <div class="py-1">
            <a href="/profil" id="editProfileLink" class="flex items-center gap-2.5 px-4 py-2 text-slate-700 hover:bg-blue-50 hover:text-blue-700 font-semibold transition">
              <span class="text-base">👤</span>
              <div class="flex-1">
                <div>Éditer le profil</div>
                <div class="text-[10px] text-slate-400 font-normal">CV, axes, villes, préférences</div>
              </div>
            </a>
            <a href="/perso.html" class="flex items-center gap-2.5 px-4 py-2 text-slate-700 hover:bg-slate-50 font-semibold transition md:hidden">
              <span class="text-base">📊</span>
              <div>Vue Perso historique</div>
            </a>
          </div>

          <div class="border-t border-slate-100 my-1"></div>

          <button id="logoutBtn" type="button" class="w-full text-left flex items-center gap-2.5 px-4 py-2 text-rose-600 hover:bg-rose-50 font-semibold transition">
            <span class="text-base">🚪</span>
            <span>Se déconnecter</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="view" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8"></main>

<div id="modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 sm:p-4 overflow-y-auto">
  <div id="modalBox" class="bg-white rounded-3xl max-w-3xl w-full p-5 sm:p-8 shadow-2xl relative my-4"></div>
</div>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2.5 rounded-xl text-sm font-semibold shadow-lg"></div>

<script src="/app.js"></script>
</body>
</html>
