<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Radar</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
if (window.tailwind) tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
  colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',500:'#2563eb',600:'#1d4ed8',700:'#1e40af',900:'#0f172a' } } } } };
</script>
<script src="config.js"></script>
<style>
  body { background:#fafaf9; }
  .scroll::-webkit-scrollbar{width:6px;height:6px}.scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .desc{white-space:pre-line}
  .chart-box{position:relative;width:100%;height:280px}
  .nav-btn[aria-current="page"]{background:#eff6ff;color:#1d4ed8}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px #93c5fd}
</style>
</head>
<body class="text-slate-800 antialiased font-sans min-h-screen flex flex-col">

<header id="topbar" class="hidden sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <a href="#/offres" class="flex items-center gap-2.5 shrink-0">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-700 to-indigo-600 text-white flex items-center justify-center font-extrabold text-sm">SR</span>
      <span class="font-extrabold text-slate-900 hidden sm:inline" id="appName">Stage Radar</span>
    </a>
    <nav id="nav" class="flex items-center gap-1 text-sm font-semibold text-slate-600 overflow-x-auto scroll"></nav>
    <div class="flex items-center gap-2 shrink-0">
      <a href="perso.html" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 hidden sm:inline" title="Voir le dashboard personnel d'origine">Vue Perso</a>
      <span id="whoami" class="hidden md:inline text-xs text-slate-500 max-w-[180px] truncate"></span>
      <button id="logoutBtn" class="text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">Déconnexion</button>
    </div>
  </div>
</header>

<main id="view" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8"></main>

<div id="modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 sm:p-4 overflow-y-auto">
  <div id="modalBox" class="bg-white rounded-3xl max-w-3xl w-full p-5 sm:p-8 shadow-2xl relative my-4"></div>
</div>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2.5 rounded-xl text-sm font-semibold shadow-lg"></div>

<script src="app.js"></script>
</body>
</html>
